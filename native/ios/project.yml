name: FinTrack
options:
  bundleIdPrefix: md.fintrack.personal
  deploymentTarget:
    iOS: "17.0"
packages:
  FinTrackCore:
    path: ../FinTrackCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FinTrack:
    type: application
    platform: iOS
    sources: [App, Assets.xcassets]
    dependencies:
      - package: FinTrackCore
      - target: FinTrackWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.fintrack.personal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FinTrack
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: md.fintrack.personal
            CFBundleURLSchemes: [fintrack]
  FinTrackWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    dependencies:
      - package: FinTrackCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Bugete FinTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.fintrack.personal.budgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  FinTrack:
    build:
      targets:
        FinTrack: all
