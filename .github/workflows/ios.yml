name: FinTrack iOS
on:
  push:
    branches: [work]
    paths: ['native/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test finance models and credential scope
        run: swift test --package-path native/FinTrackCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iPhone and iPad application with WidgetKit
        run: native/scripts/build-ios.sh
      - name: Upload unsigned application
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-iOS-unsigned
          path: |
            native/dist/FinTrack-unsigned.ipa
            native/dist/FinTrack-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
